services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://timework:${POSTGRES_PASSWORD}@db:5432/timework
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: timework
      POSTGRES_USER: timework
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timework_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timework -d timework"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  timework_postgres:
